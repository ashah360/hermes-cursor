name: ghost_cursor
version: 0.6.0
description: "Delegate coding tasks from Hermes to Cursor Cloud on hosted VMs or isolated workers on your own machine, with named sessions, progress updates, follow-ups, cancellation, restart reattachment, and final-result delivery."
author: Arman Hezarkhani
kind: backend
provides_tools:
  - cursor_create_session
  - cursor_send_message
  - cursor_status
  - cursor_stop
  - cursor_events
  - cursor_list
  - cursor_subscribe
