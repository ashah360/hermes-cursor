name: ghost_cursor
version: 0.6.0
description: "Run Cursor Cloud coding agents from Hermes, on Cursor-hosted VMs or isolated workers on your own machine. Includes named sessions, live progress, follow-ups, native cancellation, restart recovery, and automatic terminal delivery."
author: Arman
kind: backend
provides_tools:
  - cursor_create_session
  - cursor_send_message
  - cursor_status
  - cursor_stop
  - cursor_events
  - cursor_list
  - cursor_subscribe
